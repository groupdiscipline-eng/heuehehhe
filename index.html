<style>
:root{
  --primary:#4361ee; --primary-dark:#2f47c9; --accent:#8b5cf6;
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f7f8fd;
  --text:#151a2d; --muted:#6b7280; --border:#e6e9f4;
  --success:#22c55e; --success-bg:#e9f9ef; --danger:#e63946; --danger-bg:#fdecec;
  --warn:#f59e0b; --warn-bg:#fef3e0;
  --shadow: 0 1px 2px rgba(20,25,50,.04), 0 6px 20px rgba(20,25,50,.06);
  --radius:14px;
  --sidebar-bg:#12142a; --sidebar-text:#aeb2cf; --sidebar-border:#23264a;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131f; --surface:#181b2b; --surface-2:#1f2338;
    --text:#eef0fb; --muted:#9aa0bd; --border:#2a2f47;
    --success-bg:#123322; --danger-bg:#3a1a1a; --warn-bg:#3a2a10;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11131f; --surface:#181b2b; --surface-2:#1f2338;
  --text:#eef0fb; --muted:#9aa0bd; --border:#2a2f47;
  --success-bg:#123322; --danger-bg:#3a1a1a; --warn-bg:#3a2a10;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.hidden{display:none !important;}
.wrap-x{overflow-x:auto;}

.boot-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.boot-spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:boot-spin .7s linear infinite;}
@keyframes boot-spin{to{transform:rotate(360deg);}}

/* ---------- Auth pages ---------- */
.auth-shell{min-height:100vh;display:flex;align-items:stretch;justify-content:center;}
.auth-visual{flex:1;max-width:480px;background:linear-gradient(160deg,#151a3d 0%,#241a5e 55%,#3a1f7a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 36px;color:#fff;text-align:center;}
.auth-visual img{width:190px;height:190px;object-fit:contain;margin-bottom:28px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));}
.auth-visual h2{font-size:26px;margin-bottom:10px;}
.auth-visual p{color:rgba(255,255,255,.75);font-size:14px;max-width:320px;}

/* Uploads the original .pptx to Storage under the signed-in user's own folder
   and returns a persistent download URL, so the original file (not just the

window.__uploadPptToStorage = function(file, onProgress){
  return new Promise((resolve, reject) => {

    const u = auth.currentUser;

    if(!u){
      reject(new Error('User is not signed in.'));
      return;
    }

    const safeName = file.name.replace(/[^\w.\-() ]/g, '_');
    const path = `ppts/${u.uid}/${Date.now()}_${safeName}`;
    const fileRef = storageRef(storage, path);

    const uploadTask = uploadBytesResumable(fileRef, file);

    uploadTask.on(
      'state_changed',

      snapshot => {
        const progress = Math.round(
          (snapshot.bytesTransferred / snapshot.totalBytes) * 100
        );

        if(typeof onProgress === 'function'){
          onProgress(progress);
        }
      },

      error => {
        console.error('PPT Storage upload error:', error);
        reject(error);
      },

      async () => {
        try{
          const url = await getDownloadURL(uploadTask.snapshot.ref);
          resolve(url);
        }catch(error){
          reject(error);
        }
      }
    );
  });

function dbGet(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : (fallback ?? null); }catch(e){ return fallback ?? null; } }
function dbSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return 'h'+h; }

   not localStorage, so they follow the account across browsers/devices.

/* Instant local cache so a reload / re-login shows the user's quizzes,
   decks and history immediately instead of a blank screen, while fresh
   data is fetched from Firestore in the background (see loadCachedDataForUser
   and onAuthStateChanged above). Cache is keyed per uid so switching accounts
   on the same device never leaks data between users. */
function loadCachedDataForUser(uid){
  try{ quizzesCache = JSON.parse(localStorage.getItem('fq_cache_quizzes_'+uid) || '[]'); }catch(e){ quizzesCache = []; }
  try{ decksCache = JSON.parse(localStorage.getItem('fq_cache_decks_'+uid) || '[]'); }catch(e){ decksCache = []; }

}

/* publicQuizzes/{quizId} is a top-level mirror of a quiz so an unauthenticated
   student can open a shared quiz link / QR code and take it without logging in.
   Firestore rules should allow public read of publicQuizzes/{id} and public
   create of publicQuizzes/{id}/submissions/{subId} (see comment near the bottom
   of this file for a sample ruleset). */
function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const t = setTimeout(()=> reject(new Error('timeout')), ms);
    Promise.resolve(promise).then(v=>{ clearTimeout(t); resolve(v); }, e=>{ clearTimeout(t); reject(e); });
  });
}
async function mirrorQuizPublic(quiz){
  try{
    const u = currentUser();
    const ownerId = quiz.ownerId || (u && u.id);
    if(!ownerId) throw new Error('No owner id for quiz');
    await setDoc(doc(firestore, 'publicQuizzes', quiz.id), {
      id: quiz.id,
      ownerId,
      title: quiz.title || 'Untitled quiz',
      subject: quiz.subject || '',
      difficulty: quiz.difficulty || 'Medium',
      questions: JSON.parse(JSON.stringify(quiz.questions || [])),
      expiresAt: quiz.shareExpiresAt || null,
      updatedAt: nowISO()
    });
    return true;
  }catch(e){ console.error('Mirror public quiz error:', e); window.__lastPublishError = (e && ((e.code||'') + ' ' + (e.message||''))).trim() || 'unknown'; return false; }
}

  const u = currentUser();
  quizzesCache.push(quiz);

  await mirrorQuizPublic(quiz);

async function updateQuizDoc(quizId, patch){
  const u = currentUser();
  const idx = quizzesCache.findIndex(q=>q.id===quizId);
  if(idx===-1) return;
  quizzesCache[idx] = {...quizzesCache[idx], ...patch};
  if(!u){ window.__lastPublishError = 'not-signed-in'; return; }
  cacheQuizzes(u.id);
  const saveOwn = setDoc(doc(firestore, 'users', u.id, 'quizzes', quizId), quizzesCache[idx])
    .catch(e=>{ console.error('Update quiz error:', e); });
  const mirrored = await mirrorQuizPublic(quizzesCache[idx]);
  saveOwn; // keeps saving in the background
  return mirrored;
}

/* ---------------- pptx text extraction ---------------- */
async function extractPptxText(file){
  const zip = await JSZip.loadAsync(file);
  const slideFiles = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n));
  slideFiles.sort((a,b)=>{
    const na = parseInt(a.match(/slide(\d+)\.xml/)[1]), nb = parseInt(b.match(/slide(\d+)\.xml/)[1]);
    return na-nb;
  });
  const slides = [];
  for(const name of slideFiles){
    const xml = await zip.files[name].async('string');
    const texts = [...xml.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m=>m[1]);
    const joined = texts.join(' ').replace(/\s+/g,' ').trim();
    if(joined) slides.push(joined);
  }
  return slides;
}

/* ---------------- rule-based quiz generator (fallback) ---------------- */
const STOPWORDS = new Set(['the','a','an','is','are','was','were','of','in','on','at','to','for','and','or','with','by','as','that','this','it','be','from','which','their','its','has','have','had','will','can','also','into','than','these','those','such','not','but','all','more','most','other','some','then','so','if','because']);
function pickKeyword(sentence){
  const words = sentence.replace(/[^a-zA-Z0-9\s\-]/g,'').split(/\s+/).filter(w=>w.length>3 && !STOPWORDS.has(w.toLowerCase()));
  if(!words.length) return null;
  words.sort((a,b)=> b.length-a.length);
  return words[0];
}
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function ruleBasedQuiz(slideTexts, count, difficulty){
  const allText = slideTexts.join(' ');
  const sentences = allText.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>25 && s.length<200);
  const allWords = [...new Set(allText.replace(/[^a-zA-Z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>4 && !STOPWORDS.has(w.toLowerCase())))];
  const questions = [];
  const used = new Set();
  for(const s of shuffleArr(sentences)){
    if(questions.length>=count) break;
    const kw = pickKeyword(s);
    if(!kw || used.has(kw.toLowerCase())) continue;
    used.add(kw.toLowerCase());
    const blanked = s.replace(new RegExp('\\b'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'),'_____');
    if(blanked===s) continue;
    let distractors = shuffleArr(allWords.filter(w=>w.toLowerCase()!==kw.toLowerCase())).slice(0,3);
    while(distractors.length<3) distractors.push('None of these');
    const options = shuffleArr([kw, ...distractors]);
    questions.push({ id:uid('q'), text:`Fill in the blank: "${blanked}"`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
  }
     // pad with slide-topic questions if not enough
  let i=0;
  const maxPad = Math.max(slideTexts.length*3, count*4, 20);
  while(questions.length<count && slideTexts.length && i<maxPad){
    const t = slideTexts[i % slideTexts.length];
    const kw = pickKeyword(t);
    if(kw && !used.has(kw.toLowerCase())){
      used.add(kw.toLowerCase());
      const distractors = shuffleArr(allWords.filter(w=>w.toLowerCase()!==kw.toLowerCase())).slice(0,3);
      while(distractors.length<3) distractors.push('None of these');
      const options = shuffleArr([kw, ...distractors]);
      questions.push({ id:uid('q'), text:`Which term relates most to: "${t.slice(0,80)}${t.length>80?'…':''}"`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
    }
    i++;
  }
  // final guaranteed pad: if the source material is too short/thin to reach the
  // requested count from real sentences, fill the remainder with clearly-labeled
  // generic review questions so the user always gets exactly the number they asked for.
  const topicGuess = (slideTexts[0]||'this topic').slice(0,60);
  let g = 1;
  while(questions.length<count){
    const pool = allWords.length ? allWords : [topicGuess];
    const kw = shuffleArr(pool)[0] || topicGuess;
    const distractors = shuffleArr(pool.filter(w=>w!==kw)).slice(0,3);
    while(distractors.length<3) distractors.push(`Option ${distractors.length+2}`);
    const options = shuffleArr([kw, ...distractors]);
    questions.push({ id:uid('q'), text:`Review question ${g}: Which of these is most associated with "${topicGuess}${topicGuess.length>=60?'…':''}"?`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
    g++;
  }
  return questions.slice(0,count);
                                    }

    async function aiGenerateQuiz(contextText, topic, count, difficulty){
  const sampler = await getSampler();
  if(!sampler) return null;
  const prompt = `You are a quiz generator for a flashcard/quiz study app. Based on the following material, generate exactly ${count} multiple-choice questions at ${difficulty||'Medium'} difficulty. Topic/context: ${topic||'(see material)'}.

MATERIAL:
"""${(contextText||'').slice(0,6000)}"""

Respond with ONLY a raw JSON array (no markdown fences, no commentary) where each item is:
{"text": "question text", "options": ["opt1","opt2","opt3","opt4"], "answerIndex": 0}
answerIndex is the 0-based index of the correct option in "options". Make questions clear and unambiguous, options plausible, only one correct answer.`;
  try{
    const res = await sampler(prompt, { modelTier:'default' });
    let txt = (res && res.text) ? res.text.trim() : '';
    txt = txt.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const jsonMatch = txt.match(/\[[\s\S]*\]/);
    const arr = JSON.parse(jsonMatch ? jsonMatch[0] : txt);
    return arr.map(q => ({ id:uid('q'), text:q.text, options:q.options, answerIndex:q.answerIndex, difficulty: difficulty||'Medium' })).filter(q=>q.text && Array.isArray(q.options) && q.options.length>=2);
  }catch(e){
    return null;
  }
}

/* ---------------- enforce exact question count ---------------- */
function ensureCount(questions, contextTexts, count, difficulty){
  let qs = (questions||[]).slice(0, count);
  if(qs.length < count){
    const need = count - qs.length;
    const extra = ruleBasedQuiz(contextTexts, need, difficulty);
    const existingTexts = new Set(qs.map(q=>q.text));
    for(const e of extra){
      if(qs.length >= count) break;
      if(!existingTexts.has(e.text)){ qs.push(e); existingTexts.add(e.text); }
    }
  }
  return qs.slice(0, count);
}

function bindAuthHandlers(){

  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = document.getElementById(btn.dataset.toggle);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    });
  });
const createAccountBtn = document.getElementById('createAccountBtn');
if(createAccountBtn) createAccountBtn.addEventListener('click', ()=> go('/register'));
  const backToLoginBtn = document.getElementById('backToLoginBtn');
if(backToLoginBtn) backToLoginBtn.addEventListener('click', ()=> go('/login'));

  /* ---- Role selector: Register (Teacher Account / Student Account) ---- */
  window.__selectedRegisterRole = window.__selectedRegisterRole || null;
  const roleTeacherBtn = document.getElementById('roleTeacherBtn');
  const roleStudentBtn = document.getElementById('roleStudentBtn');
  if(roleTeacherBtn && roleStudentBtn){
    const setRole = (role)=>{
      window.__selectedRegisterRole = role;
      roleTeacherBtn.classList.toggle('selected', role==='teacher');
      roleStudentBtn.classList.toggle('selected', role==='student');
    };
    roleTeacherBtn.addEventListener('click', ()=> setRole('teacher'));
    roleStudentBtn.addEventListener('click', ()=> setRole('student'));
  }

  /* ---- Role selector: Login (Teacher Login / Student Login) ---- */
  window.__selectedLoginRole = window.__selectedLoginRole || 'teacher';
  const loginRoleTeacherBtn = document.getElementById('loginRoleTeacherBtn');
  const loginRoleStudentBtn = document.getElementById('loginRoleStudentBtn');
  if(loginRoleTeacherBtn && loginRoleStudentBtn){
    const setLoginRole = (role)=>{
      window.__selectedLoginRole = role;
      loginRoleTeacherBtn.classList.toggle('selected', role==='teacher');
      loginRoleStudentBtn.classList.toggle('selected', role==='student');
    };
    loginRoleTeacherBtn.addEventListener('click', ()=> setLoginRole('teacher'));
    loginRoleStudentBtn.addEventListener('click', ()=> setLoginRole('student'));
    setLoginRole(window.__selectedLoginRole);
  }

  /* ================= LOGIN ================= */

  const lf = document.getElementById('loginForm');

  if(lf) lf.addEventListener('submit', async e=>{
    e.preventDefault();

    const identifier = document
      .getElementById('li_user')
      .value
      .trim()
      .toLowerCase();

    const pass = document.getElementById('li_pass').value;
    const msg = document.getElementById('authMsg');

    msg.innerHTML = `<div class="ok-msg">Logging in...</div>`;

    try{

      let email = identifier;

      /* Login using username */
      if(!identifier.includes('@')){

        const q = query(
          collection(firestore, 'users'),
          where('usernameLower', '==', identifier)
        );

        const snapshot = await getDocs(q);

        if(snapshot.empty){
          msg.innerHTML =
            `<div class="err-msg">Username not found.</div>`;
          return;
        }

        email = snapshot.docs[0].data().email;
      }

      const credential =
        await signInWithEmailAndPassword(auth, email, pass);

      const user = credential.user;

      /* Verify the account's registered role matches the login tab chosen */
      const profileSnap = await getDoc(doc(firestore, 'users', user.uid));
      const profileData = profileSnap.exists() ? profileSnap.data() : null;
      const accountRole = profileData && profileData.role ? profileData.role : 'teacher';
      const chosenRole = window.__selectedLoginRole || 'teacher';

      if(accountRole !== chosenRole){
        await signOut(auth);
        const roleLabel = accountRole === 'teacher' ? 'Teacher Login' : 'Student Login';
        msg.innerHTML =
          `<div class="err-msg">This account is registered as a ${accountRole==='teacher'?'Teacher':'Student'}. Please use ${roleLabel} instead.</div>`;
        return;
      }

      localStorage.setItem('fq_firebase_uid', user.uid);
      localStorage.setItem('fq_firebase_profile', JSON.stringify(profileData||{}));

      msg.innerHTML = '';

      toast('Welcome back!');

      go('/dashboard');

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">Incorrect username/email or password.</div>`;
    }

  });


  /* ================= REGISTER ================= */

  const rf = document.getElementById('registerForm');

  if(rf) rf.addEventListener('submit', async e=>{
    e.preventDefault();

    const name =
      document.getElementById('r_name').value.trim();

    const username =
      document.getElementById('r_user').value.trim();

    const email =
      document.getElementById('r_email').value.trim().toLowerCase();

    const pass =
      document.getElementById('r_pass').value;

    const pass2 =
      document.getElementById('r_pass2').value;

    const msg =
      document.getElementById('authMsg');

    if(pass !== pass2){
      msg.innerHTML =
        `<div class="err-msg">Passwords do not match.</div>`;
      return;
    }

    if(pass.length < 6){
      msg.innerHTML =
        `<div class="err-msg">Password must be at least 6 characters.</div>`;
      return;
    }

    if(username.length < 3){
      msg.innerHTML =
        `<div class="err-msg">Username must be at least 3 characters.</div>`;
      return;
    }

    const role = window.__selectedRegisterRole;
    if(role !== 'teacher' && role !== 'student'){
      msg.innerHTML =
        `<div class="err-msg">Please choose a Teacher Account or a Student Account.</div>`;
      return;
    }

    msg.innerHTML =
      `<div class="ok-msg">Creating account...</div>`;

    const explain = (error, fallback)=>{
      const code = (error && error.code) || '';
      const map = {
        'auth/email-already-in-use': 'Email is already registered.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/weak-password': 'Password is too weak.',
        'auth/operation-not-allowed': 'Email/Password sign-in is not enabled in Firebase (Authentication → Sign-in method).',
        'auth/unauthorized-domain': 'This website address is not authorized in Firebase (Authentication → Settings → Authorized domains).',
        'auth/network-request-failed': 'Network error. Check your internet connection and try again.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
        'permission-denied': 'Firestore rules are blocking account creation. Publish the rules from firestore.rules.',
        'unavailable': 'Cannot reach the database. Check your internet connection and try again.'
      };
      const base = map[code] || fallback;
      return code && !map[code] ? `${base} (${code})` : base;
    };

    let user = null;

    try{

      /* Best-effort username check. This runs before login, so if Firestore
         rules don't allow it we skip it instead of blocking sign-up. */

      try{
        const usernameQuery = query(
          collection(firestore, 'users'),
          where('usernameLower', '==', username.toLowerCase())
        );

        const usernameSnapshot =
          await getDocs(usernameQuery);

        if(!usernameSnapshot.empty){
          msg.innerHTML =
            `<div class="err-msg">Username already taken.</div>`;
          return;
        }
      }catch(checkErr){
        console.warn('Username check skipped:', checkErr);
      }

      /* Create Firebase Authentication account */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          pass
        );

      user = credential.user;

      /* Save profile in Firestore */

      const createdAt = new Date().toISOString();

      const profile = {
        uid: user.uid,
        name: name,
        username: username,
        usernameLower: username.toLowerCase(),
        email: email,
        role: role,
        createdAt: createdAt
      };

      try{
        await setDoc(doc(firestore, 'users', user.uid), profile);
      }catch(profileErr){
        /* Roll back the auth account so the person can simply try again
           instead of getting "Email is already registered". */
        console.error('Profile save failed:', profileErr);
        try{ await deleteUser(user); }catch(delErr){ console.error(delErr); try{ await signOut(auth); }catch(e){} }
        msg.innerHTML =
          `<div class="err-msg">${explain(profileErr, 'Could not save your profile.')}</div>`;
        return;
      }

      localStorage.setItem('fq_firebase_uid', user.uid);
      localStorage.setItem('fq_firebase_profile', JSON.stringify(profile));

      msg.innerHTML = '';

      toast('Account created! Welcome to Flashcard Quiz.');

      go('/dashboard');

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">${explain(error, 'Unable to create account.')}</div>`;
    }

  });


  /* ================= FORGOT PASSWORD ================= */

  const ff = document.getElementById('forgotForm');

  if(ff) ff.addEventListener('submit', async e=>{
    e.preventDefault();

    const email =
      document.getElementById('f_email')
      .value
      .trim()
      .toLowerCase();

    const msg =
      document.getElementById('authMsg');

    const btn =
      document.getElementById('forgotBtn');

    try{

      await sendPasswordResetEmail(
        auth,
        email
      );

      msg.innerHTML =
        `<div class="ok-msg">
          Password reset link sent to your email.
        </div>`;

      btn.textContent = 'Reset Email Sent';

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">
          Unable to send reset email. Check the email address.
        </div>`;
    }

  });
}

        <div class="topbar-user">

</div>

}
function bindGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.nav)));
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.addEventListener('click', async ()=>{ try{ await signOut(auth); }catch(e){ console.error('Logout error:',e); } finally{ setSession(null); go('/login'); } });
  const mt = document.getElementById('menuToggle');
  if(mt) mt.addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
  if(window.innerWidth<=820 && mt) mt.style.display='flex';
  const gs = document.getElementById('globalSearch');
  if(gs) gs.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const q = gs.value.trim().toLowerCase();
      if(!q) return;
      const hit = myQuizzes().find(z=>z.title.toLowerCase().includes(q));
      if(hit) go('/quiz-review?'+hit.id); else toast('No quiz found matching "'+gs.value+'"');
    }
  });
}

/* ================= DASHBOARD ================= */
function dashboardView(){
  const u = currentUser();
  const quizzes = myQuizzes();
  const hist = myHistory();
  const totalQuizzes = quizzes.length;
  const totalQuestions = quizzes.reduce((s,q)=> s+q.questions.length, 0);
  const completed = hist.length;
  const avgScore = completed ? Math.round(hist.reduce((s,h)=> s+h.percentage,0)/completed) : 0;
  const recent = hist.slice(0,5);
  const trend = hist.slice(-8);
  return `
  <div class="page-head"><h1>Hi, ${escapeHtml(u.name)} 👋</h1><p>Every quiz gets you closer to your goal.</p></div>
  <div class="grid grid-4" style="margin-bottom:26px;">
    ${statCard(totalQuizzes, 'QUIZZES', '#ece9fe', '#151a2d')}
    ${statCard(totalQuestions, 'QUESTIONS', '#fbbf24', '#151a2d')}
    ${statCard(completed, 'COMPLETED', '#22c55e', '#0b3d1f')}
    ${statCard(avgScore+'%', 'AVERAGE SCORE', '#ec4899', '#3d0b23')}
  </div>
  <div class="section-title">Start something</div>
  <div class="grid grid-4" style="margin-bottom:26px;">
    <div class="action-tile tile-yellow" data-nav="/upload-ppt"><div class="icon">📤</div><b>Upload PowerPoint</b><span>Turn slides into a quiz</span></div>
    <div class="action-tile tile-pink" data-nav="/generate-ai"><div class="icon">✨</div><b>Generate with AI</b><span>Pick a topic & count</span></div>
    <div class="action-tile tile-green" data-nav="/create-manual"><div class="icon">✏️</div><b>Create manually</b><span>Write your own</span></div>
    <div class="action-tile tile-purple" data-nav="/flashcards"><div class="icon">📁</div><b>Flashcards</b><span>Flip & memorize</span></div>
  </div>
  <div class="grid grid-2">
    <div class="card pad">
      <div class="section-title" style="margin-bottom:14px;">Recent activity</div>
      ${recent.length ? `<table><tr><th>Quiz</th><th>Date</th><th>Score</th></tr>
        ${recent.map(h=>`<tr><td>${escapeHtml(h.quizTitle)}</td><td>${fmtDate(h.date)}</td><td><span class="tag ${h.percentage>=70?'tag-easy':h.percentage>=50?'tag-medium':'tag-hard'}">${h.percentage}%</span></td></tr>`).join('')}
      </table>` : `<div class="empty-card"><div class="icon">🎯</div><p>No attempts yet. Take a quiz!</p></div>`}
    </div>
    <div class="card pad">
      <div class="section-title" style="margin-bottom:14px;">Score trend</div>
      ${trend.length ? `<div style="display:flex;align-items:flex-end;gap:6px;height:110px;padding:0 4px;">
        ${trend.map(h=>`<div style="flex:1;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:4px 4px 0 0;height:${Math.max(6,h.percentage)}%;" title="${escapeHtml(h.quizTitle)}: ${h.percentage}%"></div>`).join('')}
      </div>` : `<div class="empty-card"><div class="icon">📈</div><p>Your progress will appear here.</p></div>`}
    </div>
  </div>
  `;
}
function statCard(num, lbl, bg, fg){
  return `<div class="card pad stat-card" style="background:${bg};color:${fg};box-shadow:none;"><div class="num" style="color:${fg};">${num}</div><div class="lbl" style="color:${fg};opacity:.75;">${lbl}</div></div>`;
        }

let manualQuestions = [];
function createManualView(editId){
  manualQuestions = [];
  let editing = null;
  if(editId){ editing = getQuizzes().find(q=>q.id===editId); if(editing) manualQuestions = JSON.parse(JSON.stringify(editing.questions)); }
  return `
  <div class="page-head"><h1>${editing?'Edit Quiz':'Create Quiz Manually'}</h1><p>Add your own questions and customize your quiz.</p></div>
  <div class="grid" style="grid-template-columns:1.3fr .9fr;gap:20px;" id="manualGrid">
    <div class="card pad">
      <div class="form-row">
        <div class="field"><label>Quiz Title</label><input id="mq_title" value="${editing?escapeHtml(editing.title):''}" placeholder="Enter quiz title"></div>
        <div class="field"><label>Subject</label>

            ${['General','Math','Science','History','English','Programming','Other'].map(s=>`<option ${editing&&editing.subject===s?'selected':''}>${s}</option>`).join('')}

      <div class="field"><label>Difficulty</label>
        <select id="mq_diff">
          ${['Easy','Medium','Hard'].map(s=>`<option ${editing&&editing.difficulty===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;">
        <div class="section-title" style="margin:0;">Questions (<span id="qCount">${manualQuestions.length}</span>)</div>

      </div>
      <div id="questionsList"></div>
    </div>

function questionCardHtml(q, idx){
  return `<div class="q-card" data-qid="${q.id}">

    </div>
    ${q.options.map((opt,i)=>`
      <div class="opt-row">
        <input type="radio" class="opt-radio" name="correct_${q.id}" data-oidx="${i}" ${q.answerIndex===i?'checked':''}>
        <input type="text" data-oidx="${i}" value="${escapeHtml(opt)}" placeholder="Option ${String.fromCharCode(65+i)}">
      </div>`).join('')}

function refreshQuestionsList(){
  document.getElementById('questionsList').innerHTML = manualQuestions.map((q,i)=>questionCardHtml(q,i)).join('') || `<div class="empty"><div class="icon">📝</div><p>No questions yet. Click "Add Question" to begin.</p></div>`;
  document.getElementById('qCount').textContent = manualQuestions.length;
  bindQuestionCardHandlers();
}
function bindQuestionCardHandlers(){
  document.querySelectorAll('.q-card').forEach(card=>{
    const qid = card.dataset.qid;
    const q = manualQuestions.find(x=>x.id===qid);
    card.querySelector('.q-text-input').addEventListener('input', e=> q.text = e.target.value);
    card.querySelectorAll('.opt-row input[type=text]').forEach(inp=>{
      inp.addEventListener('input', e=> q.options[+e.target.dataset.oidx] = e.target.value);
    });
    card.querySelectorAll('.opt-radio').forEach(r=>{
      r.addEventListener('change', e=> q.answerIndex = +e.target.dataset.oidx);
    });
    card.querySelector('.del-q').addEventListener('click', ()=>{
      manualQuestions = manualQuestions.filter(x=>x.id!==qid);
      refreshQuestionsList();
    });
  });
}
function bindManualQuizHandlers(editId){
  refreshQuestionsList();
  document.getElementById('addQBtn').addEventListener('click', ()=>{
    manualQuestions.push({ id:uid('q'), text:'', options:['','','',''], answerIndex:0 });
    refreshQuestionsList();
  });
  document.getElementById('previewBtn').addEventListener('click', ()=>{
    if(!manualQuestions.length){ toast('Add at least one question first.'); return; }
    openPreviewModal(manualQuestions);
  });
  document.getElementById('saveQuizBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('mq_title').value.trim();
    if(!title){ toast('Please enter a quiz title.'); return; }
    const cleaned = manualQuestions.filter(q=>q.text.trim() && q.options.every(o=>o.trim()));
    if(!cleaned.length){ toast('Add at least one complete question.'); return; }
    const u = currentUser();
    const btn = document.getElementById('saveQuizBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    if(editId){
      await updateQuizDoc(editId, { title, subject:document.getElementById('mq_subject').value, description:document.getElementById('mq_desc').value, difficulty:document.getElementById('mq_diff').value, questions:cleaned });
    } else {
      await addQuizDoc({ id:uid('quiz'), ownerId:u.id, title, subject:document.getElementById('mq_subject').value, description:document.getElementById('mq_desc').value, difficulty:document.getElementById('mq_diff').value, questions:cleaned, createdAt: nowISO(), source:'manual' });
    }
    toast(editId? 'Quiz updated!' : 'Quiz saved!');
    go('/my-quizzes');
  });
}
function openPreviewModal(questions){
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal" style="max-width:520px;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><h3>Quiz Preview</h3><button class="icon-btn" id="closePreview">✕</button></div>

}

function bindUploadPptHandlers(){

async function handlePptFile(file){
  if(!/\.pptx$/i.test(file.name)){
    toast('Please upload a .pptx file.');
    return;
  }

  const u = currentUser();

  if(!u){
    toast('Please log in before uploading a PowerPoint file.');
    return;
  }

  pptFileName = file.name;
  pptFileUrl = null;

  const infoWrap = document.getElementById('fileInfoWrap');

  if(!infoWrap){
    console.error('fileInfoWrap element not found.');
    toast('Upload area is unavailable. Please refresh the page.');
    return;
  }

  infoWrap.innerHTML = `
    <div class="card pad" style="margin-top:16px;background:var(--surface-2);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;gap:10px;align-items:center;">
          <span style="font-size:20px;">📄</span>
          <div>
            <b style="font-size:13.5px;">${escapeHtml(file.name)}</b>
            <div style="font-size:12px;color:var(--muted);">
              ${(file.size/1024/1024).toFixed(2)} MB
            </div>
          </div>
        </div>
        <span id="pptStatusIcon">⏳</span>
      </div>

      <div class="progress-bar">
        <div id="pptProgress" style="width:10%"></div>
      </div>

      <p id="pptStatusText"
         style="font-size:12.5px;color:var(--muted);margin-top:8px;">
        Reading slides…
      </p>
      <p id="pptUploadNote" style="font-size:11.5px;color:var(--muted);margin-top:4px;"></p>
    </div>
  `;

  try{

    /* =====================================================
       STEP 1 — UPLOAD ORIGINAL PPT TO FIREBASE STORAGE
       ===================================================== */

    if(typeof window.__uploadPptToStorage !== 'function'){
      throw new Error('Firebase Storage upload function is not available.');
    }

    /* The Storage upload runs in the BACKGROUND. It no longer blocks reading the
       slides / generating the quiz, so a slow or misconfigured Storage can't freeze
       the page at 0%. */
    const setNote = (t, color)=>{ const n = document.getElementById('pptUploadNote'); if(n){ n.textContent = t; n.style.color = color || 'var(--muted)'; } };
    /* Set to true only if you enable Firebase Storage (needs the paid Blaze plan). */
    const ENABLE_PPT_BACKUP = false;
    if(ENABLE_PPT_BACKUP){
    setNote('☁️ Backing up original file… 0%');
    Promise.race([
      window.__uploadPptToStorage(file, progress => {
        setNote('☁️ Backing up original file… ' + progress + '%');
      }),
      new Promise((_, rej)=> setTimeout(()=> rej(new Error('Storage upload timed out')), 120000))
    ]).then(url=>{
      pptFileUrl = url;
      if(window.__pendingPptQuiz) window.__pendingPptQuiz.pptFileUrl = url;
      setNote('✅ Original file backed up to your account.', 'var(--success)');
    }).catch(err=>{
      console.error('PPT Storage upload failed (quiz can still be created):', err);
      const code = (err && (err.code || err.message)) || 'unknown';
      setNote('⚠️ Original file was not backed up (' + code + '). You can still create the quiz.', 'var(--danger)');
    });
    }

    const progressBar = document.getElementById('pptProgress');
    const statusText = document.getElementById('pptStatusText');
    if(progressBar) progressBar.style.width = '30%';
    if(statusText) statusText.textContent = 'Reading slides…';

    const extractedSlides = await extractPptxText(file);


    /* =====================================================
       STEP 4 — SAVE EXTRACTED SLIDES
       ===================================================== */

    pptSlides = extractedSlides || [];

    document.getElementById('pptProgress').style.width = '100%';

    const statusIcon = document.getElementById('pptStatusIcon');

    if(statusIcon) statusIcon.textContent = '✅';

    if(statusText){
      statusText.textContent =
        `Extracted text from ${pptSlides.length} slide(s). You can generate the quiz now.`;
    }

    if(!pptSlides.length){
      if(statusText){
        statusText.textContent =
          'No readable text was found in this file.';
      }
      toast('No readable text was found in this PPT.');
      return;
    }

    /* =====================================================
       STEP 5 — SHOW QUIZ OPTIONS ONLY AFTER PPT IS SAVED
       ===================================================== */

    const optionsWrap = document.getElementById('pptOptionsWrap');

    if(!optionsWrap){
      throw new Error('pptOptionsWrap element not found.');
    }

    optionsWrap.innerHTML = `
      <div style="margin-top:18px;">

        <div class="field">
          <label>Quiz Title</label>
          <input
            id="ppt_title"
            value="${escapeHtml(pptFileName.replace(/\.pptx$/i,''))}">
        </div>

        <div class="form-row">

          <div class="field">
            <label>Number of Questions</label>
            <input
              id="ppt_count"
              type="number"
              min="1"
              value="10">
          </div>

          <div class="field">
            <label>Difficulty Level</label>
            <select id="ppt_diff">
              <option>Easy</option>
              <option selected>Medium</option>
              <option>Hard</option>
            </select>
          </div>

        </div>

        <p style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">
          Your PowerPoint is already saved to your account.
          The quiz will be linked to this uploaded file.
        </p>

        <button class="btn btn-primary" id="genFromPptBtn">
          Generate Questions
        </button>

      </div>

      <div id="pptResultWrap" style="margin-top:16px;"></div>
    `;

    /* =====================================================
       STEP 6 — GENERATE QUESTIONS
       ===================================================== */

    document.getElementById('genFromPptBtn').addEventListener('click', async ()=>{

      const count = Math.max(
        1,
        parseInt(document.getElementById('ppt_count').value) || 10
      );

      const diff = document.getElementById('ppt_diff').value;

      const btn = document.getElementById('genFromPptBtn');

      btn.disabled = true;
      btn.textContent = 'Generating…';

      try{

        const combined = pptSlides.join('\n');

        let questions = await aiGenerateQuiz(
          combined,
          pptFileName,
          count,
          diff
        );

        let source = 'ai';

        if(!questions || !questions.length){

          questions = ruleBasedQuiz(
            pptSlides,
            count,
            diff
          );

          source = 'fallback';

        }else{

          questions = ensureCount(
            questions,
            pptSlides,
            count,
            diff
          );

        }

        window.__pendingPptQuiz = {
          title:
            document.getElementById('ppt_title').value.trim()
            || pptFileName,

          questions,
          source,

          /* IMPORTANT:
             Keep the Firebase Storage URL with the pending quiz.
          */
          pptFileName: pptFileName,
          pptFileUrl: pptFileUrl
        };

        document.getElementById('pptResultWrap').innerHTML = `
          <div class="card pad">

            <div class="section-title">
              Generated Questions (${questions.length})
              ${
                source === 'fallback'
                ? '<span class="tag tag-medium">auto</span>'
                : '<span class="tag tag-blue">AI</span>'
              }
            </div>

            ${questions.map((q,i)=>`

              <div class="q-card">

                <b>
                  ${i+1}. ${escapeHtml(q.text)}
                </b>

                ${q.options.map((o,idx)=>`

                  <div
                    class="quiz-opt ${idx===q.answerIndex?'correct':''}"
                    style="cursor:default;"
                  >
                    <span class="opt-letter">
                      ${String.fromCharCode(65+idx)}
                    </span>

                    ${escapeHtml(o)}
                  </div>

                `).join('')}

              </div>

            `).join('')}

            <button class="btn btn-primary" id="savePptQuizBtn">
              💾 Save Quiz
            </button>

          </div>
        `;

        /* =================================================
           STEP 7 — SAVE QUIZ TO FIRESTORE
           ================================================= */

        document
          .getElementById('savePptQuizBtn')
          .addEventListener('click', async (e)=>{

            const user = currentUser();

            if(!user){
              toast('Please log in again.');
              return;
            }

            const data = window.__pendingPptQuiz;

            if(!data || !data.questions || !data.questions.length){
              toast('No generated questions to save.');
              return;
            }

            /* Final safety check:
               Do not save quiz without the PPT URL.
            */

            e.target.disabled = true;
            e.target.textContent = 'Saving…';

            try{

              await addQuizDoc({

                id: uid('quiz'),

                ownerId: user.id,

                title: data.title,

                subject: 'From PowerPoint',

                description:
                  `Generated from ${data.pptFileName}`,

                difficulty: diff,

                questions: data.questions,

                createdAt: nowISO(),

                source: 'ppt',

                /* Firebase Storage information */
                pptFileName: data.pptFileName,

                pptFileUrl: data.pptFileUrl || pptFileUrl || null

              });

              toast('Quiz saved to your account!');

              go('/my-quizzes');

            }catch(saveError){

              console.error(
                'Save PPT quiz error:',
                saveError
              );

              toast(
                'Could not save the quiz to your account.'
              );

              e.target.disabled = false;
              e.target.textContent = '💾 Save Quiz';

            }

          });

      }catch(generateError){

        console.error(
          'PPT quiz generation error:',
          generateError
        );

        toast(
          'Could not generate questions. Please try again.'
        );

      }finally{

        btn.disabled = false;
        btn.textContent = 'Generate Questions';

      }

    });

  }catch(e){

    console.error(
      'PPT upload/read error:',
      e
    );

    pptFileUrl = null;

    const icon = document.getElementById('pptStatusIcon');
    const text = document.getElementById('pptStatusText');

    if(icon) icon.textContent = '❌';

    if(text){
      text.textContent =
        'Could not save/read this PowerPoint. Please try again.';
    }

    toast(
      'PowerPoint upload failed. The quiz was not created.'
    );

  }
      }

function aiReviewView(){
  return `
  <div class="page-head"><h1>AI Summarize/Review</h1><p>Paste your notes or slide text below and let AI summarize the key points for you to review.</p></div>
  <div class="card pad" style="max-width:720px;">
    <div class="field"><label>Paste notes / text to summarize</label><textarea id="ar_input" rows="10" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13.5px;" placeholder="Paste your study notes, slide text, or an article here…"></textarea></div>
    <button class="btn btn-primary" id="arSummarizeBtn">✨ Summarize with AI</button>
    <p id="arStatus" style="font-size:12.5px;color:var(--muted);margin-top:10px;"></p>
  </div>
  <div id="arResultWrap" style="margin-top:20px;"></div>
  `;
}
async function aiSummarize(text){
  const sampler = await getSampler();
  const fallback = ()=>{
    const sentences = text.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>20);
    const top = sentences.slice(0, Math.min(6, sentences.length));
    return { summary: top.join(' '), points: top.slice(0,5) };
  };
  if(!sampler) return { ...fallback(), source:'fallback' };
  const prompt = `Summarize the following study material for a student. Then list the 5 most important key points to review.
Respond with ONLY raw JSON (no markdown fences): {"summary": "2-4 sentence summary", "points": ["point 1","point 2","point 3","point 4","point 5"]}

MATERIAL:
"""${(text||'').slice(0,6000)}"""`;
  try{
    const res = await sampler(prompt, { modelTier:'default' });
    let txt = (res && res.text) ? res.text.trim() : '';
    txt = txt.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const jsonMatch = txt.match(/\{[\s\S]*\}/);
    const obj = JSON.parse(jsonMatch ? jsonMatch[0] : txt);
    if(!obj.summary || !Array.isArray(obj.points)) throw new Error('bad shape');
    return { ...obj, source:'ai' };
  }catch(e){
    return { ...fallback(), source:'fallback' };
  }
}
function bindAiReviewHandlers(){
  document.getElementById('arSummarizeBtn').addEventListener('click', async ()=>{
    const text = document.getElementById('ar_input').value.trim();
    if(!text){ toast('Paste some text first.'); return; }
    const status = document.getElementById('arStatus');
    const btn = document.getElementById('arSummarizeBtn');
    btn.disabled = true; status.textContent = 'Summarizing…';
    const result = await aiSummarize(text);
    btn.disabled = false;
    status.textContent = result.source==='ai' ? 'Summarized with AI.' : 'AI unavailable — generated a quick summary instead.';
    document.getElementById('arResultWrap').innerHTML = `
      <div class="card pad">
        <div class="section-title" style="margin-bottom:10px;">Summary</div>
        <p style="font-size:14px;line-height:1.6;margin-bottom:16px;">${escapeHtml(result.summary)}</p>
        <div class="section-title" style="margin-bottom:10px;">Key Points to Review</div>
        <ul style="margin:0;padding-left:20px;line-height:1.9;font-size:13.5px;">
          ${result.points.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}
        </ul>
        <button class="btn btn-outline" id="arQuizBtn" style="margin-top:16px;width:auto;padding:9px 16px;">📝 Turn this into a practice quiz</button>
        <div id="arQuizWrap" style="margin-top:16px;"></div>
      </div>`;
    document.getElementById('arQuizBtn').addEventListener('click', async (e)=>{
      e.target.disabled = true; e.target.textContent = 'Generating…';
      let questions = await aiGenerateQuiz(text, 'Review', 5, 'Medium');
      if(!questions || !questions.length) questions = ruleBasedQuiz([text], 5, 'Medium');
      e.target.disabled = false; e.target.textContent = '📝 Turn this into a practice quiz';

function quizShareLink(quizId){
  /* Hosted address students will open. When you test from localhost / a file,
     the hosted GitHub Pages address is used so the QR works on phones. */
  const HOSTED_BASE = 'https://groupdiscipline-eng.github.io/FLASHCARDQUIZ/';
  const isLocal = !/^https?:$/.test(location.protocol) || ['localhost','127.0.0.1',''].includes(location.hostname);
  const base = isLocal ? HOSTED_BASE : (location.origin + location.pathname);
  return `${base}#/quiz-take?${quizId}`;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
function setShareStatus(kind, msg){
  const el = document.getElementById('sharePublishStatus');
  if(!el) return;
  const c = kind==='ok' ? 'var(--success)' : kind==='err' ? 'var(--danger)' : 'var(--muted)';
  el.style.color = c; el.textContent = msg;
}
async function diagnoseFirestore(){
  const el = document.getElementById('shareDiag');
  if(!el) return;
  el.textContent = '🔍 Testing connection to Firestore…';
  let msg = 'Project: '+firebaseConfig.projectId+' · database: (default) · ';
  try{
    await withTimeout(getDocFromServer(doc(firestore,'publicQuizzes','__ping')), 12000);
    msg += 'Firestore server is reachable ✅ (so the problem is rules or the publish itself).';
  }catch(e){
    if(e && e.message === 'timeout') msg += 'No response from Firestore server ❌ — the database probably does not exist in this project (or is not the "(default)" Standard database), or this network/browser blocks it.';
    else msg += 'Server answered with: '+((e && (e.code||''))+' '+(e && e.message||'')).trim();
  }
  const el2 = document.getElementById('shareDiag'); if(el2) el2.textContent = msg;
}
async function publishQuizLink(quizId, patch){
  setShareStatus('wait','⏳ Publishing link…');
  try{
    const ok = await withTimeout(updateQuizDoc(quizId, patch), 30000);
    if(ok === true) setShareStatus('ok','✅ Link is live — students can open it without logging in.');
    else{
      const code = window.__lastPublishError || '';
      const why = /permission/i.test(code) ? 'Firestore rules are blocking it — publish the rules from firestore.rules.'
        : /not-signed-in/.test(code) ? 'You are signed out — log in again.'
        : /unavailable|network|offline/i.test(code) ? 'Cannot reach Firestore — try mobile data or another Wi-Fi.'
        : /not-found/i.test(code) ? 'Firestore Database is not created yet in Firebase Console.'
        : 'Error: '+code;
      setShareStatus('err','⚠️ Link not published. '+why);
    }
    return ok === true;
  }catch(e){
    setShareStatus('err','⚠️ Cannot reach Firestore (timed out). Not a Wi-Fi speed problem — see the test result below.');
    diagnoseFirestore();
    return false;
  }
}

function loadScriptTag(src){
  return new Promise((res, rej)=>{ const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=rej; document.head.appendChild(t); });
}
async function ensureQrLib(){
  if(typeof QRCode !== 'undefined') return true;
  for(const src of ['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js']){
    try{ await loadScriptTag(src); if(typeof QRCode !== 'undefined') return true; }catch(e){}
  }
  return false;
}
/* Renders the QR code, then composites it onto a canvas with the shareable
   link printed in small text underneath, so the single downloaded image
   contains BOTH the QR code and the readable link. */
async function buildQrComposite(link, title){
  window.__qrBlob = null;
  const fail = ()=>{ const m=document.getElementById('qrLoadingMsg'); if(m){ m.style.color='var(--danger)'; m.textContent='QR code could not be generated. Use the link below instead.'; } };
  if(!(await ensureQrLib())) return fail();
  const target = document.getElementById('qrRenderTarget');
  if(!target) return;
  target.innerHTML = '';
  /* High-resolution QR (560px) with a wide white border so the saved picture
     is sharp and scans easily from a phone or a printed page. */
  const size = 560, pad = 48, titleH = 52, textH = 116;
  try{ new QRCode(target, { text: link, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ console.error('QR error:', e); return fail(); }
  setTimeout(()=>{
    const qrCanvas = target.querySelector('canvas');
    const qrImg = target.querySelector('img');
    const canvas = document.createElement('canvas');
    canvas.width = size + pad*2;
    canvas.height = size + pad*2 + textH + titleH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#151a2d';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(title.length>34 ? title.slice(0,34)+'…' : title, canvas.width/2, pad+4);
    const finish = ()=>{
      ctx.fillStyle = '#6b7280';
      ctx.font = '22px Arial';
      wrapCanvasText(ctx, link, canvas.width/2, pad + titleH + size + 44, canvas.width-48, 26);
      const finalUrl = canvas.toDataURL('image/png');
      const img = document.getElementById('qrFinalImg'), msg = document.getElementById('qrLoadingMsg');
      if(!img) return;
      img.src = finalUrl; img.style.display = 'block';
      const hint = document.getElementById('qrHint'); if(hint) hint.style.display = 'block';
      if(msg) msg.remove();
      canvas.toBlob(b=>{ window.__qrBlob = b; }, 'image/png');
    };
    if(qrCanvas && qrCanvas.width){ ctx.drawImage(qrCanvas, pad, pad+titleH, size, size); finish(); }
    else if(qrImg && qrImg.src){
      const im = new Image();
      im.onload = ()=>{ ctx.drawImage(im, pad, pad+titleH, size, size); finish(); };
      im.onerror = fail;
      im.src = qrImg.src;
    } else fail();
  }, 80);
}

/* Saves the QR picture to the device. Uses a real file (blob) instead of a
   data-URL link, which many phone browsers refuse to download. */
async function downloadQrImage(fileName){
  const blob = window.__qrBlob;
  if(!blob){ toast('QR code is still generating. Try again in a moment.'); return; }
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const inApp = /FBAN|FBAV|Instagram|Line\/|Messenger|MicroMessenger/i.test(ua);
  const file = new File([blob], fileName, { type:'image/png' });
  const url = URL.createObjectURL(blob);
  /* iPhone/iPad: open the share sheet, then tap "Save Image" */
  if(isIOS && navigator.canShare && navigator.canShare({ files:[file] })){
    try{ toast('Tap "Save Image" to add it to your Photos.'); await navigator.share({ files:[file], title:fileName }); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  /* In-app browsers (Facebook, Messenger…) block downloads: show the image to save */
  if(inApp){
    window.open(url, '_blank');
    toast('Press and hold the QR picture, then choose Save Image.');
    return;
  }
  const a = document.createElement('a');
  a.href = url; a.download = fileName; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
  toast(/Android/i.test(ua) ? 'Saved! Open Gallery and look in the "Download" album.' : 'QR code downloaded.');
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split('');
  let line = '', lines = [];
  for(const ch of words){
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = ch; }
    else line = test;
  }
  if(line) lines.push(line);
  lines = lines.slice(0,3);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
}

function startQuizTimer(){
  clearInterval(quizTimerInt);
  const timerEl = document.getElementById('quizTimer');
  quizTimerInt = setInterval(()=>{
    if(!quizRuntime || !timerEl) { clearInterval(quizTimerInt); return; }
    const secs = Math.floor((Date.now()-quizRuntime.startedAt)/1000);
    const m = String(Math.floor(secs/60)).padStart(2,'0'), s = String(secs%60).padStart(2,'0');

    if(el) el.textContent = `${m}:${s}`;

function finishQuiz(){
  clearInterval(quizTimerInt);
  const quiz = quizRuntime.quiz;
  let correct = 0;
  quiz.questions.forEach((q,i)=>{ if(quizRuntime.answers[i]===q.answerIndex) correct++; });
  const total = quiz.questions.length;
  const percentage = Math.round((correct/total)*100);
  const timeSpentSec = Math.floor((Date.now()-quizRuntime.startedAt)/1000);
  const u = currentUser();
  const attempt = { id:uid('att'), ownerId:u.id, quizId:quiz.id, quizTitle:quiz.title, date: nowISO(), correct, total, percentage, timeSpentSec, answers: quizRuntime.answers.slice() };

}

  if(!quiz) return `<div class="empty"><p>Quiz not found.</p></div>`;
  const attempts = myHistory().filter(h=>h.quizId===quizId);
  const attempt = attemptId ? attempts.find(a=>a.id===attemptId) : attempts[0];
  if(!attempt) return `<div class="empty"><p>No attempt found for this quiz yet. <button class="link-btn" onclick="go('/quiz-play?${quizId}')">Take the quiz</button></p></div>`;
  return `
  <div class="page-head"><h1>Quiz Review</h1><p>Check your answers and learn from your mistakes.</p></div>
  <div class="card pad" style="max-width:700px;">
    ${quiz.questions.map((q,i)=>{
      const ua = attempt.answers[i];
      const isCorrect = ua === q.answerIndex;
      return `<div class="q-card">
        <div style="display:flex;justify-content:space-between;gap:10px;"><b>${i+1}. ${escapeHtml(q.text)}</b><span class="tag ${isCorrect?'tag-easy':'tag-hard'}">${isCorrect?'Correct':'Incorrect'}</span></div>
        <p style="font-size:13px;margin-top:8px;">Your answer: <b>${ua!==null? escapeHtml(q.options[ua]) : '(no answer)'}</b></p>
        ${!isCorrect?`<p style="font-size:13px;color:var(--success);">Correct answer: <b>${escapeHtml(q.options[q.answerIndex])}</b></p>`:''}
      </div>`;
    }).join('')}
    <button class="btn btn-primary" style="width:auto;padding:10px 18px;" onclick="go('/my-quizzes')">Back to My Quizzes</button>
  </div>`;
}

async function bindQuizSubmissionsHandlers(quizId){
  const card = document.getElementById('submissionsCard');
  const loadSubs = ()=> getDocs(collection(firestore, 'publicQuizzes', quizId, 'submissions'));
  try{
    let snap;
    try{ snap = await withTimeout(loadSubs(), 20000); }
    catch(first){
      /* The rule reads publicQuizzes/{quizId}.ownerId, so it is denied when that
         public copy was never published. Re-publish it once, then retry. */
      const q = getQuizzes().find(x=>x.id===quizId);
      if(q && first && first.code==='permission-denied' && await mirrorQuizPublic(q)){
        snap = await withTimeout(loadSubs(), 20000);
      }else throw first;
    }
    const subs = snap.docs.map(d=>d.data()).sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt));
    if(!subs.length){
      card.innerHTML = `<div class="empty-card"><div class="icon">🧑‍🎓</div><p>No students have submitted this quiz yet. Share the QR code or link to get started.</p></div>`;
      return;
    }
    card.innerHTML = `<div style="overflow-x:auto;"><table class="sub-table">
      <tr><th>Name</th><th>Grade &amp; Section</th><th>Strand</th><th>Score</th><th>Submitted</th></tr>
      ${subs.map(s=>`<tr>
        <td>${escapeHtml(s.studentName||'')}</td>
        <td>${escapeHtml(s.gradeSection||'')}</td>
        <td>${escapeHtml(s.strand||'')}</td>
        <td><span class="tag ${s.percentage>=70?'tag-easy':s.percentage>=50?'tag-medium':'tag-hard'}">${s.correct}/${s.total} (${s.percentage}%)</span></td>
        <td>${fmtDate(s.submittedAt)}</td>
      </tr>`).join('')}
    </table></div>`;
  }catch(e){
    console.error('Load submissions error:', e);
    card.innerHTML = `<div class="empty-card"><div class="icon">⚠️</div><p>Could not load submissions.<br><small style="word-break:break-word;">${escapeHtml(((e&&e.code)||'')+' '+((e&&e.message)||''))}</small><br><small>Open Share on this quiz once to publish it, make sure you are logged in as the quiz owner, and that the Firestore rules are published.</small></p></div>`;
  }
}

/* ================= PUBLIC QUIZ-TAKE FLOW (no login required) =================
   Reached via the shared QR code / link. Shows a student-info form first
   (Name, Grade & Section, Strand), then the quiz itself, then saves the
   student's info + answers + score to publicQuizzes/{quizId}/submissions
   in Firestore so the teacher can see who has answered. */
let publicQuizRuntime = null; // {quiz, student:{name,gradeSection,strand}, index, answers[], startedAt}
function quizTakeView(quizId){
  if(!quizId) return renderPublicShell(`<div class="empty-card"><div class="icon">⚠️</div><p>This quiz link is missing an ID.</p></div>`);
  if(!window.__publicQuizCache) window.__publicQuizCache = {};
  const cached = window.__publicQuizCache[quizId];

  if(!cached){
    // trigger async load, show loading state meanwhile
    loadPublicQuiz(quizId);
    return renderPublicShell(`<div class="empty-card"><div class="icon">⏳</div><p>Loading quiz…</p></div>`);
  }
  if(cached === 'missing' || cached === 'error'){
    return renderPublicShell(`<div class="empty-card"><div class="icon">⚠️</div><p>${cached==='missing' ? 'This quiz was removed or the link is not valid. Ask your teacher for a new link.' : 'This quiz could not be loaded. Check your connection, or ask your teacher to re-share the link.'}</p></div>`);
  }

  const quiz = cached;
  if(!publicQuizRuntime || publicQuizRuntime.quiz.id !== quizId){
    publicQuizRuntime = { quiz, student:null, index:0, answers:new Array(quiz.questions.length).fill(null), startedAt:null };
  }

  const stateCard = (icon, title, msg, btn)=> renderPublicShell(`<div class="empty-card"><div class="icon">${icon}</div><h1 style="font-size:20px;margin-bottom:8px;">${title}</h1><p>${msg}</p>${btn?'<button class="link-btn" id="ptDiffBtn" style="margin-top:14px;">Not you? Continue as a different student</button>':''}</div>`);
  if(!publicQuizRuntime.student && !publicQuizRuntime.finished){
    if(quizIsExpired(quiz)) return stateCard('⏰','This link is expired','The time to answer this quiz is over. Ask your teacher for a new link.');
    const dev = deviceAnswered(quiz.id) && !window.__anotherStudent;
    if(publicQuizRuntime.alreadyAnswered || dev) return stateCard('✅','This quiz is already answered','Each student can answer this quiz only once.', true);
  }

  if(!publicQuizRuntime.student){
    return renderPublicShell(`
      <h1 style="font-size:20px;margin-bottom:4px;">${escapeHtml(quiz.title)}</h1>
      <p style="color:var(--muted);font-size:13px;margin-bottom:18px;">Please tell us who you are before starting the quiz.</p>
      <div id="ptMsg"></div>
      <form id="ptInfoForm">
        <div class="field"><label>Full Name</label><input type="text" id="pt_name" placeholder="Enter your full name" required></div>
        <div class="field"><label>Grade &amp; Section</label><input type="text" id="pt_grade" placeholder="e.g. Grade 12 - St. Peter" required></div>
        <div class="field"><label>Strand</label><input type="text" id="pt_strand" placeholder="e.g. STEM, ABM, HUMSS" required></div>
        <button class="btn btn-primary" type="submit">Start Quiz →</button>
      </form>`);
  }

  if(publicQuizRuntime.finished){
    const r = publicQuizRuntime.result;
    return renderPublicShell(`
      <div class="done-screen">
        ${brandHtml(true)}
        <h1 style="font-size:22px;margin-bottom:4px;">Quiz Submitted!</h1>
        <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${escapeHtml(quiz.title)}</p>
        <div class="donut" style="margin:0 auto 18px;background:conic-gradient(var(--primary) ${r.percentage*3.6}deg, var(--border) 0deg);">
          <div class="inner"><b>${r.percentage}%</b><span>${r.correct} / ${r.total}</span></div>
        </div>
        <p style="font-size:13.5px;color:var(--muted);">Thanks, ${escapeHtml(publicQuizRuntime.student.studentName)}! Your teacher can now see your result.</p>
        <p style="font-size:12px;color:var(--muted);margin-top:18px;">Made with FlashcardQuiz · You can close this page now.</p>
      </div>
    `, { noBrand:true });
  }

  const q = quiz.questions[publicQuizRuntime.index];
  const pct = Math.round((publicQuizRuntime.index/quiz.questions.length)*100);
  return renderPublicShell(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div><h1 style="font-size:18px;">${escapeHtml(quiz.title)}</h1><p style="font-size:12.5px;color:var(--muted);">Question ${publicQuizRuntime.index+1} of ${quiz.questions.length}</p></div>
    </div>
    <div class="progress-bar" style="margin-bottom:18px;"><div style="width:${pct}%"></div></div>
    <b style="font-size:16px;display:block;margin-bottom:14px;">${escapeHtml(q.text)}</b>
    <div id="ptOptsWrap">
      ${q.options.map((o,i)=>`<div class="quiz-opt ${publicQuizRuntime.answers[publicQuizRuntime.index]===i?'selected':''}" data-oidx="${i}"><span class="opt-letter">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:18px;">
      <button class="btn btn-outline" id="ptPrevBtn" style="width:auto;padding:10px 20px;" ${publicQuizRuntime.index===0?'disabled':''}>← Previous</button>
      <button class="btn btn-primary" id="ptNextBtn" style="width:auto;padding:10px 20px;">${publicQuizRuntime.index===quiz.questions.length-1?'Submit':'Next →'}</button>
    </div>
  `);
}
function quizIsExpired(q){ return !!q.expiresAt && Date.now() > new Date(q.expiresAt).getTime(); }
function deviceAnswered(id){ try{ return !!localStorage.getItem('fq_answered_'+id); }catch(e){ return false; } }
async function studentKey(quizId, ...parts){
  const s = quizId+'|'+parts.map(p=>p.toLowerCase().replace(/[^a-z0-9]/g,'')).join('|');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function renderPublicShell(inner, opts){
  const noBrand = opts && opts.noBrand;
  return `<div class="auth-shell"><div class="auth-form-side" style="width:100%;max-width:620px;margin:0 auto;"><div class="auth-card">${noBrand ? '' : brandHtml()}${inner}</div></div></div>`;
}
async function loadPublicQuiz(quizId){
  try{
    const snap = await getDoc(doc(firestore, 'publicQuizzes', quizId));
    window.__publicQuizCache[quizId] = snap.exists() ? snap.data() : 'missing';
  }catch(e){
    console.error('Load public quiz error:', e);
    window.__publicQuizCache[quizId] = 'error';
  }
  render();
}
function bindQuizTakeHandlers(quizId){
  const diffBtn = document.getElementById('ptDiffBtn');
  if(diffBtn){ diffBtn.addEventListener('click', ()=>{ window.__anotherStudent = true; publicQuizRuntime.alreadyAnswered = false; render(); }); return; }
  const infoForm = document.getElementById('ptInfoForm');
  if(infoForm){
    infoForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const studentName = document.getElementById('pt_name').value.trim();
      const gradeSection = document.getElementById('pt_grade').value.trim();
      const strand = document.getElementById('pt_strand').value.trim();
      if(!studentName || !gradeSection || !strand){
        document.getElementById('ptMsg').innerHTML = `<div class="err-msg">Please fill in all fields.</div>`;
        return;
      }
      const quiz = publicQuizRuntime.quiz;
      if(quizIsExpired(quiz)){ render(); return; }
      const btn = infoForm.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';
      let done = false;
      try{
        publicQuizRuntime.key = await studentKey(quiz.id, studentName, gradeSection, strand);
        done = (await getDoc(doc(firestore, 'publicQuizzes', quiz.id, 'answered', publicQuizRuntime.key))).exists();
      }catch(err){ console.error('Answered check error:', err); }
      if(done){ publicQuizRuntime.alreadyAnswered = true; render(); return; }
      publicQuizRuntime.student = { studentName, gradeSection, strand };
      publicQuizRuntime.startedAt = Date.now();
      render();
    });
    return;
  }
  const optsWrap = document.getElementById('ptOptsWrap');
  if(optsWrap){
    optsWrap.querySelectorAll('.quiz-opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        publicQuizRuntime.answers[publicQuizRuntime.index] = +el.dataset.oidx;
        optsWrap.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
  }
  const prevBtn = document.getElementById('ptPrevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ publicQuizRuntime.index--; render(); });
  const nextBtn = document.getElementById('ptNextBtn');
  if(nextBtn) nextBtn.addEventListener('click', async ()=>{
    if(publicQuizRuntime.answers[publicQuizRuntime.index]===null){ if(!confirm('No answer selected. Continue anyway?')) return; }
    if(publicQuizRuntime.index < publicQuizRuntime.quiz.questions.length-1){
      publicQuizRuntime.index++;
      render();
    } else {
      nextBtn.disabled = true; nextBtn.textContent = 'Submitting…';
      if(!(await submitPublicQuiz())){ nextBtn.disabled = false; nextBtn.textContent = 'Submit'; }
    }
  });
}
async function submitPublicQuiz(){
  const quiz = publicQuizRuntime.quiz;
  let correct = 0;
  quiz.questions.forEach((q,i)=>{ if(publicQuizRuntime.answers[i]===q.answerIndex) correct++; });
  const total = quiz.questions.length;
  const percentage = Math.round((correct/total)*100);
  const timeSpentSec = Math.floor((Date.now()-publicQuizRuntime.startedAt)/1000);
  const submission = {
    id: publicQuizRuntime.subId || (publicQuizRuntime.subId = uid('sub')),
    quizId: quiz.id,
    quizTitle: quiz.title,
    studentName: publicQuizRuntime.student.studentName,
    gradeSection: publicQuizRuntime.student.gradeSection,
    strand: publicQuizRuntime.student.strand,
    answers: publicQuizRuntime.answers.slice(),
    correct, total, percentage, timeSpentSec,
    submittedAt: nowISO()
  };
  try{
    await withTimeout(setDoc(doc(firestore, 'publicQuizzes', quiz.id, 'submissions', submission.id), submission), 20000);
  }catch(e){
    console.error('Submit quiz error:', e);
    toast('Could not submit — please check your connection and try again.');
    return false;
  }
  if(publicQuizRuntime.key){ try{ await setDoc(doc(firestore, 'publicQuizzes', quiz.id, 'answered', publicQuizRuntime.key), { answeredAt: nowISO() }); }catch(e){ console.error('Answered marker error:', e); } }
  try{ localStorage.setItem('fq_answered_'+quiz.id, nowISO()); }catch(e){}
  publicQuizRuntime.finished = true;
  publicQuizRuntime.result = { correct, total, percentage };
  render();
  return true;
}

  return `<div class="page-head"><h1>Quiz History</h1><p>View your completed quizzes and performance.</p></div>
