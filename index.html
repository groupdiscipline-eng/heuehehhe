  <tr><th>Quiz Title</th><th>Date</th><th>Score</th><th>Percentage</th><th>Correct</th><th></th></tr>
  ${hist.map(h=>`<tr>
    <td>${escapeHtml(h.quizTitle)}</td><td>${fmtDate(h.date)}</td><td>${h.correct}/${h.total}</td>
    <td><span class="tag ${h.percentage>=70?'tag-easy':h.percentage>=50?'tag-medium':'tag-hard'}">${h.percentage}%</span></td>
    <td>${h.correct}</td>
    <td><button class="pill-btn" onclick="go('/quiz-review?${h.quizId}__${h.id}')">Review</button></td>
  </tr>`).join('')}
  </table></div>`;
}

/* ================= PROFILE ================= */
function profileView(){
  const u = currentUser();
  const hist = myHistory();
  const avgScore = hist.length ? Math.round(hist.reduce((s,h)=>s+h.percentage,0)/hist.length) : 0;
  const initials = (u.name||'?').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  return `
  <div class="page-head"><h1>Profile</h1><p>Manage your personal information.</p></div>
  <div class="card pad" style="max-width:560px;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
      <div class="avatar" style="width:64px;height:64px;font-size:22px;">${initials}</div>
      <div><b style="font-size:16px;">${escapeHtml(u.name)}</b><p style="font-size:12.5px;color:var(--muted);">@${escapeHtml(u.username)}</p></div>
    </div>
    <div class="field"><label>Full Name</label><input id="p_name" value="${escapeHtml(u.name)}"></div>
    <div class="field"><label>Username</label><input id="p_user" value="${escapeHtml(u.username)}"></div>
    <div class="field"><label>Email</label><input id="p_email" value="${escapeHtml(u.email)}"></div>
    <button class="btn btn-primary" id="saveProfileBtn" style="width:auto;padding:10px 18px;">Save Changes</button>
    <div class="nav-sep"></div>
    <div class="section-title">Change Password</div>
    <div class="field"><label>Current Password</label><input type="password" id="p_curpass"></div>
    <div class="field"><label>New Password</label><input type="password" id="p_newpass"></div>
    <button class="btn btn-outline" id="changePassBtn" style="width:auto;padding:10px 18px;">Change Password</button>
    <div class="nav-sep"></div>
    <div class="grid grid-3">
      <div class="card pad" style="padding:12px;"><div class="num" style="font-size:18px;">${myQuizzes().length}</div><div class="lbl">Total Quizzes</div></div>
      <div class="card pad" style="padding:12px;"><div class="num" style="font-size:18px;">${hist.length}</div><div class="lbl">Completed Quizzes</div></div>
      <div class="card pad" style="padding:12px;"><div class="num" style="font-size:18px;">${avgScore}%</div><div class="lbl">Average Score</div></div>
    </div>
  </div>`;
}
function bindProfileHandlers(){
  document.getElementById('saveProfileBtn').addEventListener('click', ()=>{
    const u = currentUser();
    const users = getUsers();
    const name = document.getElementById('p_name').value.trim();
    const username = document.getElementById('p_user').value.trim();
    const email = document.getElementById('p_email').value.trim();
    if(!name || !username || !email){ toast('All fields are required.'); return; }
    if(users.some(x=>x.id!==u.id && x.username.toLowerCase()===username.toLowerCase())){ toast('Username already taken.'); return; }
    const idx = users.findIndex(x=>x.id===u.id);
    users[idx] = {...users[idx], name, username, email };
    saveUsers(users);
    toast('Profile updated!');
    render();
  });
  document.getElementById('changePassBtn').addEventListener('click', ()=>{
    const u = currentUser();
    const cur = document.getElementById('p_curpass').value;
    const nw = document.getElementById('p_newpass').value;
    if(simpleHash(cur) !== u.password){ toast('Current password is incorrect.'); return; }
    if(nw.length<4){ toast('New password must be at least 4 characters.'); return; }
    const users = getUsers();
    const idx = users.findIndex(x=>x.id===u.id);
    users[idx].password = simpleHash(nw);
    saveUsers(users);
    toast('Password changed!');
    document.getElementById('p_curpass').value=''; document.getElementById('p_newpass').value='';
  });
}

/* ================= SETTINGS ================= */
function settingsView(){
  const s = mySettings();
  const theme = dbGet(DB_KEYS.THEME,'system');
  return `
  <div class="page-head"><h1>Settings</h1><p>Manage your account and preferences.</p></div>
  <div class="card pad" style="max-width:560px;">
    <div class="section-title">Notification Settings</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div><b style="font-size:13.5px;">Email Notifications</b><p style="font-size:12px;color:var(--muted);">Get notified about your quiz activity</p></div>
      <button class="toggle ${s.emailNotif?'on':''}" id="toggleEmail"><div class="knob"></div></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div><b style="font-size:13.5px;">Quiz Reminders</b><p style="font-size:12px;color:var(--muted);">Remind me to take quizzes</p></div>
      <button class="toggle ${s.quizReminders?'on':''}" id="toggleReminder"><div class="knob"></div></button>
    </div>
    <div class="nav-sep"></div>
    <div class="section-title">Theme Settings</div>
    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <button class="pill-btn ${theme==='light'?'':''}" id="lightModeBtn" style="flex:1;${theme==='light'?'border-color:var(--primary);color:var(--primary);':''}">☀️ Light Mode</button>
      <button class="pill-btn" id="darkModeBtn" style="flex:1;${theme==='dark'?'border-color:var(--primary);color:var(--primary);':''}">🌙 Dark Mode</button>
    </div>
    <div class="nav-sep"></div>
    <button class="btn btn-danger" id="settingsLogoutBtn">🚪 Logout</button>
  </div>`;
}
function bindSettingsHandlers(){
  document.getElementById('toggleEmail').addEventListener('click', ()=>{ const s=mySettings(); s.emailNotif=!s.emailNotif; saveSettings(s); render(); });
  document.getElementById('toggleReminder').addEventListener('click', ()=>{ const s=mySettings(); s.quizReminders=!s.quizReminders; saveSettings(s); render(); });
  document.getElementById('lightModeBtn').addEventListener('click', ()=>{ dbSet(DB_KEYS.THEME,'light'); applyTheme(); render(); });
  document.getElementById('darkModeBtn').addEventListener('click', ()=>{ dbSet(DB_KEYS.THEME,'dark'); applyTheme(); render(); });
  document.getElementById('settingsLogoutBtn').addEventListener('click', async ()=>{ try{ await signOut(auth); }catch(e){ console.error('Logout error:',e); } finally{ setSession(null); go('/login'); } });
}

/* ================= GUIDE ================= */
let guideTab = 'teacher';
function guideStep(icon, title, body){
  return `<div class="q-card" style="display:flex;gap:14px;align-items:flex-start;">
    <div class="stat-card icon" style="width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;">${icon}</div>
    <div><b style="font-size:14px;">${title}</b><p style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;">${body}</p></div>
  </div>`;
}
function guideView(){
  const teacherSteps = [
    guideStep('🔑','Create an account / log in', 'On the login screen, choose <b>Teacher</b>, then tap "Create one" to sign up with your name, email and password, or log back in any time with the same email and password. Your account and everything in it follow you to any device you log into.'),
    guideStep('📤','Upload a PowerPoint', 'Go to <b>Upload PPT</b>, drag in a .pptx file (or tap to browse), and the app extracts the text from every slide. The original file is stored permanently under your account, so it is available again later even after logging out or switching devices.'),
    guideStep('✨','Generate an AI quiz', 'From an uploaded PPT, tap <b>Generate AI Quiz</b>. The app reads the slide content and drafts multiple-choice questions for you, which you can review and edit on the next screen before saving.'),
    guideStep('✏️','Build a quiz manually', 'Use <b>Create Quiz</b> to add your own questions and answer choices from scratch, mark the correct answer, and set a title, subject and difficulty.'),
    guideStep('💾','Save and manage quizzes', 'Every quiz you create or generate is saved permanently to your account in the cloud. Open <b>My Quizzes</b> to see, edit, retitle or delete any quiz you own — changes sync back to your account automatically.'),
    guideStep('🔗','Share a quiz link or QR code', 'From <b>My Quizzes</b>, open a quiz and tap <b>Share</b> to get a public link and a scannable QR code. Anyone with the link or code can open and take the quiz instantly — no account or login required on their end.'),
    guideStep('📈','View scores and submissions', 'Open a quiz\'s <b>Submissions</b> tab to see every student who has taken it, their name/info, their answers and their score, as students complete it.'),
    guideStep('🗂️','Flashcards & other tools', 'Use <b>Flashcards</b> to turn any quiz or deck into flip-cards for studying, and check <b>History</b> for a record of quizzes you have taken yourself.'),
  ].join('');
  const studentSteps = [
    guideStep('🔑','Create an account / log in', 'On the login screen, choose <b>Student</b>, then create an account with your name, email and password (or log back in later). This lets you save AI review notes and your own quiz history.'),
    guideStep('🔗','Open a shared quiz', 'Tap the link your teacher shared, or open the camera app and scan the QR code they provided. The quiz opens right away — you do not need to log in or create an account just to take a shared quiz.'),
    guideStep('📝','Submit your info and answer', 'Enter your name (and any info requested) once, then answer each question. Your answers are saved as you go, so a lost connection or refresh will not lose your progress.'),
    guideStep('✅','View your results', 'After submitting, you will immediately see your score and a review of which answers were correct. Your teacher can also see your submission and score on their end.'),
    guideStep('📤','Upload a PPT for yourself', 'If you want to study your own material, use <b>Upload PPT</b> to add a PowerPoint, then <b>AI Summarize/Review</b> to get an AI-written summary and review notes from its content.'),
  ].join('');
  return `
  <div class="page-head"><h1>Guide</h1><p>Everything you need to use FlashcardQuiz, for teachers and students.</p></div>
  <div class="login-role-tabs" style="max-width:420px;">
    <button type="button" class="pill-btn role-btn ${guideTab==='teacher'?'selected':''}" id="guideTeacherBtn" data-tab="teacher">🧑‍🏫<br>For Teachers</button>
    <button type="button" class="pill-btn role-btn ${guideTab==='student'?'selected':''}" id="guideStudentBtn" data-tab="student">🎓<br>For Students</button>
  </div>
  <div id="guideBody" style="max-width:720px;">${guideTab==='teacher'?teacherSteps:studentSteps}</div>`;
}
function bindGuideHandlers(){
  const teacherBtn = document.getElementById('guideTeacherBtn');
  const studentBtn = document.getElementById('guideStudentBtn');
  if(teacherBtn) teacherBtn.addEventListener('click', ()=>{ guideTab='teacher'; render(); });
  if(studentBtn) studentBtn.addEventListener('click', ()=>{ guideTab='student'; render(); });
}

/* ================= PAGE HANDLER DISPATCH ================= */
function bindPageHandlers(path){
  const [p, param] = path.split('?');
  if(p==='/create-manual') bindManualQuizHandlers(param);
  else if(p==='/generate-ai') bindGenerateAiHandlers();
  else if(p==='/upload-ppt') bindUploadPptHandlers();
  else if(p==='/ai-review') bindAiReviewHandlers();
  else if(p==='/my-quizzes') bindMyQuizzesHandlers();
  else if(p==='/quiz-submissions'){ if(!isStudentUser()) bindQuizSubmissionsHandlers(param); }
  else if(p==='/quiz-play') bindQuizPlayHandlers();
  else if(p==='/quiz-results') bindQuizResultsHandlers();
  else if(p==='/flashcards') bindFlashcardsListHandlers();
  else if(p==='/flashcards-study') bindFlashcardStudyHandlers();
  else if(p==='/profile') bindProfileHandlers();
  else if(p==='/settings') bindSettingsHandlers();
  else if(p==='/guide') bindGuideHandlers();
}
</script>
